global:
  scrape_interval: 30s # how frequently to scrape metrics
  evaluation_interval: 15s # how often to evaluate rules

scrape_configs:
  - job_name: "node-exporter"
    scrape_interval: 30s
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: 'windows-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['192.168.0.14:9182']
